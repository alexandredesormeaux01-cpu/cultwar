# Fly.io — serveur Colyseus (multiplayer)
# IMPORTANT: Colyseus ne marche PAS avec 2 machines (matchmake ≠ WebSocket).
# Après chaque deploy GitHub, vérifier : fly scale count 1 -a cultwar --yes
# Déployer en CLI avec : fly deploy --ha=false
app = "cultwar"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  COLYSEUS_SEAT_RESERVATION_TIME = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1 machine chaude = multi fiable. Remettre à 0 plus tard pour économiser.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
